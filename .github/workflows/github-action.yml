name: Build and Deploy Rock Paper Scissors

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Clean and build WAR
        run: mvn -B clean install

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rock-paper-scissors-war
          path: target/rock-paper-scissors.war

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: rock-paper-scissors-war
          path: ./artifact

      - name: Deploy to Tomcat server
        if: ${{ secrets.TOMCAT_HOST != '' && secrets.TOMCAT_USER != '' && secrets.TOMCAT_SSH_KEY != '' }}
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.TOMCAT_HOST }}
          username: ${{ secrets.TOMCAT_USER }}
          key: ${{ secrets.TOMCAT_SSH_KEY }}
          source: './artifact/rock-paper-scissors.war'
          target: '/opt/tomcat/webapps/'

      - name: Restart Tomcat
        if: ${{ secrets.TOMCAT_HOST != '' && secrets.TOMCAT_USER != '' && secrets.TOMCAT_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TOMCAT_HOST }}
          username: ${{ secrets.TOMCAT_USER }}
          key: ${{ secrets.TOMCAT_SSH_KEY }}
          script: |
            cd /opt/tomcat/bin || cd /usr/share/tomcat/bin || true
            ./shutdown.sh || true
            rm -f /opt/tomcat/webapps/rock-paper-scissors.war
            ./startup.sh || true
